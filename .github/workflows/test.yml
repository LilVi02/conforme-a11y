name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # I test non richiedono un browser: la logica di mappatura,
      # aggregazione e report è separata dalla scansione.
      - run: npm test
